# Dependabot — zaif/eskirgan bog'liqliklar uchun avtomatik PR'lar.
# Antivirus uchun ayniqsa muhim: OkHttp/CameraX/ZXing (Android), Supabase/React (cloud).
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/ApkGuard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/ApkGuard/cloud"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/telegram_bot"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
