# KiberQalqon CI — har push/PR'da yashil bo'lishi shart:
#  • Android: JUnit unit-testlar + debug APK yig'ilishi (NDK/CMake avtomatik).
#  • Cloud: TypeScript tip-tekshiruvi (tsc --noEmit).
# Sirlar kerak emas: local.properties/keystore yo'q bo'lsa build baribir o'tadi
# (dev-token bo'sh, imzosiz debug) — bu loyihaning ataylab qilingan xulqi.
name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:

jobs:
  # #1 Tez gejt: FAQAT Kotlin kompilyatsiyasi (og'ir assemble/R8/dex/NDK'siz) + detekt.
  # Maqsad: kompilyatsiya xatosi (masalan "Val cannot be reassigned" shadowing) to'liq
  # buildni kutmasdan ~1 daqiqada qizil bo'lsin. To'liq `android` job'i bilan PARALLEL yuradi.
  quick:
    name: Quick — Kotlin compile + detekt (fast fail)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApkGuard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      # Bu qadam qizil bo'lsa — kod KOMPILYATSIYA bo'lmaydi (native/dex/paket emas, aynan Kotlin).
      - name: Kotlin compile (fast fail)
        run: ./gradlew :app:compileDirectDebugKotlin --stacktrace
      # #3 detekt — statik tahlil. ADVISORY (continue-on-error): mavjud kodda topilmalar
      # bo'lishi mumkin, shuning uchun hozircha pipeline'ni yiqitmaydi; hisobot artefakt bo'ladi.
      # Baseline yaratilgach bloklovchi qilinadi. CLI orqali (build.gradle o'zgarmaydi → xavfsiz).
      - name: Detekt static analysis (advisory)
        continue-on-error: true
        run: |
          V=1.23.7
          curl -sSL -o detekt-cli.jar "https://github.com/detekt/detekt/releases/download/v${V}/detekt-cli-${V}-all.jar" || { echo "detekt yuklab bo'lmadi — o'tkazildi"; exit 0; }
          java -jar detekt-cli.jar --input app/src/main/java --report txt:detekt.txt --report sarif:detekt.sarif || true
          echo "=== Detekt topilmalar (advisory, top 80) ==="
          [ -f detekt.txt ] && tail -80 detekt.txt || echo "(hisobot yo'q)"
      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: |
            ApkGuard/detekt.txt
            ApkGuard/detekt.sarif
          if-no-files-found: ignore

  android:
    name: Android — unit tests + debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApkGuard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDirectDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDirectDebug --stacktrace

      # Qurilmada sinash uchun yig'ilgan debug APK'ni yuklab olinadigan artefakt qilamiz.
      # Mahalliy build imkonsiz (RAM) — shu sabab telefonga o'rnatish uchun yagona yo'l.
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uzguard-debug-apk
          path: ApkGuard/app/build/outputs/apk/direct/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: ApkGuard/app/build/reports/tests/

  cloud:
    name: Cloud — TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApkGuard/cloud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ApkGuard/cloud/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck
