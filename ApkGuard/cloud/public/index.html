<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e1a" />
<title>KiberQalqon — Boshqaruv paneli</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E🛡%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login" class="screen login-screen">
  <div class="login-card">
    <div class="logo">🛡</div>
    <h1>KiberQalqon</h1>
    <p class="muted">Boshqaruv paneliga kirish</p>
    <form id="login-form">
      <label>
        <span>Maxfiy kalit</span>
        <input type="password" id="secret-input" autocomplete="off" placeholder="DEVICE_SHARED_SECRET" required />
      </label>
      <button type="submit" id="login-btn">Kirish</button>
      <p id="login-error" class="error hidden"></p>
    </form>
    <p class="hint">Kalit Vercel env'da, faqat siz bilasiz.</p>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="screen hidden">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">🛡</span>
      <span class="brand-name">KiberQalqon</span>
    </div>
    <div class="topbar-actions">
      <button id="refresh-btn" class="icon-btn" title="Yangilash">↻</button>
      <button id="logout-btn" class="icon-btn" title="Chiqish">⎋</button>
    </div>
  </header>

  <!-- STAT CARDS -->
  <section class="stats-grid">
    <div class="stat-card stat-total">
      <div class="stat-icon">📊</div>
      <div class="stat-body">
        <div class="stat-label">Bugun skanlar</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
    </div>
    <div class="stat-card stat-danger">
      <div class="stat-icon">🔴</div>
      <div class="stat-body">
        <div class="stat-label">Xavfli</div>
        <div class="stat-value" id="stat-danger">—</div>
      </div>
    </div>
    <div class="stat-card stat-suspicious">
      <div class="stat-icon">🟠</div>
      <div class="stat-body">
        <div class="stat-label">Shubhali</div>
        <div class="stat-value" id="stat-suspicious">—</div>
      </div>
    </div>
    <div class="stat-card stat-safe">
      <div class="stat-icon">🟢</div>
      <div class="stat-body">
        <div class="stat-label">Xavfsiz</div>
        <div class="stat-value" id="stat-safe">—</div>
      </div>
    </div>
    <div class="stat-card stat-devices">
      <div class="stat-icon">📱</div>
      <div class="stat-body">
        <div class="stat-label">Faol qurilmalar</div>
        <div class="stat-value" id="stat-devices">—</div>
      </div>
    </div>
  </section>

  <!-- TABS -->
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="scans">Skanlar</button>
    <button class="tab" data-tab="threats">Xavflar</button>
    <button class="tab" data-tab="devices">Qurilmalar</button>
  </nav>

  <!-- FILTERS (only on scans tab) -->
  <div class="filters" id="filters">
    <button class="chip active" data-verdict="">Hammasi</button>
    <button class="chip" data-verdict="danger">🔴 Xavfli</button>
    <button class="chip" data-verdict="suspicious">🟠 Shubhali</button>
    <button class="chip" data-verdict="safe">🟢 Xavfsiz</button>
  </div>

  <!-- CONTENT PANELS -->
  <section id="panel-scans" class="panel">
    <div id="scans-list" class="data-list">
      <div class="empty">Yuklanmoqda…</div>
    </div>
  </section>

  <section id="panel-threats" class="panel hidden">
    <div id="threats-list" class="data-list">
      <div class="empty">Yuklanmoqda…</div>
    </div>
  </section>

  <section id="panel-devices" class="panel hidden">
    <div id="devices-list" class="data-list">
      <div class="empty">Yuklanmoqda…</div>
    </div>
  </section>

  <footer class="footer">
    <span class="muted">KiberQalqon Cloud · Vercel · Supabase</span>
    <span class="status" id="status">●</span>
  </footer>

</div>

<!-- DETAIL MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="modal-close" id="modal-close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="/app.js" type="module"></script>
</body>
</html>
