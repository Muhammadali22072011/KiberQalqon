# Gradle properties
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Разрешить кириллицу в пути проекта
android.overridePathCheck=true

# ВНИМАНИЕ: этот флаг управляет FULL-MODE режимом R8-шринкера (НЕ "D8 dexer", НЕ версией Java —
# старый комментарий был неверным). false ослабляет обфускацию: release-APK сохраняет больше
# имён/метаданных, что противоречит цели ветки anti-re-hardening. Перед включением (удалить строку
# или поставить true) нужно собрать release с минификацией и прогнать smoke-тест на рефлексию/
# ViewBinding/OkHttp — keep-правила в proguard-rules.pro уже есть. TODO(release-blocker).
android.enableR8.fullMode=false

# Автоматическая загрузка нужной версии Java через Gradle Toolchains
# Gradle сам скачает JDK 17 если его нет
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
