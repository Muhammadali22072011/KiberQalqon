# Gradle properties
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Разрешить кириллицу в пути проекта
android.overridePathCheck=true

# FULL-MODE R8 — включён 2026-07-09 (цель ветки anti-re-hardening: максимальная обфускация).
# Full-mode агрессивнее переименовывает/сливает классы и срезает больше метаданных, чем обычный
# режим. Перед включением проведён аудит ВСЕХ рефлексивных вызовов (Class.forName/getField/
# getDeclaredMethod): все либо на framework-классах (R8 их не трогает), либо на классах с keep-
# правилами (App/NativeBridge/Shizuku/BuildConfig/databinding — пакеты исправлены com.kiberqalqon→
# com.uzguard). Остаточный риск — рефлексия под full-mode; финальный gate = смоук-тест на устройстве
# (экраны ViewBinding, облачный OkHttp-вызов, Shizuku-удаление).
android.enableR8.fullMode=true

# Автоматическая загрузка нужной версии Java через Gradle Toolchains
# Gradle сам скачает JDK 17 если его нет
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
